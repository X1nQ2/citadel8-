{% extends "base.html" %}
{% block title %}Добавить том · {{ brand }}{% endblock %}
{% block body %}
<div class="panel wide">
  <h1>Внесение нового тома</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field"><label for="title">Название издания:</label>
      <input id="title" name="title" maxlength="255" required value="{{ form.get('title', '') }}"></div>
    <div class="field"><label for="author">Автор (ФИО):</label>
      <input id="author" name="author" maxlength="100" required value="{{ form.get('author', '') }}"></div>
    <div class="row2">
      <div class="field"><label for="isbn">ISBN:</label>
        <input id="isbn" name="isbn" maxlength="25" value="{{ form.get('isbn', '') }}"></div>
      <div class="field"><label for="year">Год издания:</label>
        <input id="year" type="number" name="year" min="1000" required value="{{ form.get('year', '') }}"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="price">Стоимость, ₽:</label>
        <input id="price" type="number" step="0.01" min="0.01" name="price" required value="{{ form.get('price', '') }}"></div>
      <div class="field"><label for="stock">Количество, экз.:</label>
        <input id="stock" type="number" min="0" name="stock" required value="{{ form.get('stock', '') }}"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="genre_id">Жанр:</label>
        <select id="genre_id" name="genre_id" required>
          {% for id, name in genres %}<option value="{{ id }}" {{ 'selected' if form.get('genre_id') == id|string }}>{{ name }}</option>{% endfor %}
        </select></div>
      <div class="field"><label for="publisher_id">Издательство:</label>
        <select id="publisher_id" name="publisher_id" required>
          {% for id, name in pubs %}<option value="{{ id }}" {{ 'selected' if form.get('publisher_id') == id|string }}>{{ name }}</option>{% endfor %}
        </select></div>
    </div>
    <div class="field"><label for="cover">Обложка (JPG, PNG, WEBP, до 3 МБ):</label>
      <input id="cover" type="file" name="cover" accept="image/jpeg,image/png,image/webp"></div>
    <button class="btn block">Добавить в каталог</button>
  </form>
  <a class="link" href="{{ url_for('admin_dashboard') }}">← К товарам</a>
</div>
{% endblock %}
